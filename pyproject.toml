[project]
name = "lisbon-spatial-dynamics"
version = "1.0.1"
description = "Reproducible spatial analysis of housing values and local accommodation in Lisbon."
authors = [{ name = "Diogo Ribeiro" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
keywords = ["lisbon", "geospatial", "housing", "spatial-statistics", "reproducible-research"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "matplotlib>=3.10,<4.0",
    "shapely>=2.1,<3.0",
    "numpy>=2.3,<3.0",
    "scipy>=1.17,<2.0",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/lisbon-spatial-dynamics"
Documentation = "https://diogoribeiro7.github.io/lisbon-spatial-dynamics/"
Issues = "https://github.com/DiogoRibeiro7/lisbon-spatial-dynamics/issues"
Changelog = "https://github.com/DiogoRibeiro7/lisbon-spatial-dynamics/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lisbon_spatial_dynamics", from = "src" }]
include = [
    { path = "configs", format = "sdist" },
    { path = "tests", format = "sdist" },
]

[project.scripts]
fetch-ine-housing = "lisbon_spatial_dynamics.cli:fetch_ine_housing"
transform-ine-housing = "lisbon_spatial_dynamics.cli:transform_ine_housing"
fetch-caop-lisbon = "lisbon_spatial_dynamics.cli:fetch_caop_lisbon"
fetch-census2021-population = "lisbon_spatial_dynamics.cli:fetch_census2021_population"
build-census2021-population-reference = "lisbon_spatial_dynamics.cli:build_census2021_population_reference_cli"
build-reference-geography = "lisbon_spatial_dynamics.cli:build_reference_geography"
build-housing-freguesia-panel = "lisbon_spatial_dynamics.cli:build_housing_freguesia_panel"
build-housing-changes = "lisbon_spatial_dynamics.cli:build_housing_changes"
fetch-rnal-lisboa = "lisbon_spatial_dynamics.cli:fetch_rnal_lisboa"
build-rnal-quarter-panel = "lisbon_spatial_dynamics.cli:build_rnal_quarter_panel_cli"
build-rnal-population-pressure = "lisbon_spatial_dynamics.cli:build_rnal_population_pressure_cli"
build-annual-rnal-pressure = "lisbon_spatial_dynamics.cli:build_annual_rnal_pressure_cli"
build-annual-housing-pressure-panel = "lisbon_spatial_dynamics.cli:build_annual_housing_pressure_panel_cli"
build-urban-change-panel = "lisbon_spatial_dynamics.cli:build_urban_change_panel_cli"
build-annual-urban-panel = "lisbon_spatial_dynamics.cli:build_annual_urban_panel_cli"
build-annual-map-layers = "lisbon_spatial_dynamics.cli:build_annual_map_layers_cli"
build-freguesia-trajectories = "lisbon_spatial_dynamics.cli:build_freguesia_trajectories_cli"
build-trajectory-map = "lisbon_spatial_dynamics.cli:build_trajectory_map_cli"
build-trajectory-summary = "lisbon_spatial_dynamics.cli:build_trajectory_summary_cli"
build-descriptive-association = "lisbon_spatial_dynamics.cli:build_descriptive_association_cli"
build-pressure-association = "lisbon_spatial_dynamics.cli:build_pressure_association_cli"
build-normalized-analysis-bundle = "lisbon_spatial_dynamics.cli:build_normalized_analysis_bundle_cli"
build-census2021-context-bundle = "lisbon_spatial_dynamics.cli:build_census2021_context_bundle_cli"
build-multivariable-analysis = "lisbon_spatial_dynamics.cli:build_multivariable_analysis_cli"
build-final-results = "lisbon_spatial_dynamics.cli:build_final_results_cli"
build-study-v1 = "lisbon_spatial_dynamics.cli:build_study_v1_cli"
build-trajectory-choropleths = "lisbon_spatial_dynamics.cli:build_trajectory_choropleths_cli"
build-global-morans-i = "lisbon_spatial_dynamics.cli:build_global_morans_i_cli"
build-local-morans-i = "lisbon_spatial_dynamics.cli:build_local_morans_i_cli"
build-lisa-cluster-maps = "lisbon_spatial_dynamics.cli:build_lisa_cluster_maps_cli"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"
ruff = "^0.13"
mypy = "^1.18"
pre-commit = "^4.0"
types-shapely = "^2.1.0.20260728"
scipy-stubs = "^1.18.1.1"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.6,<10.0"

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
