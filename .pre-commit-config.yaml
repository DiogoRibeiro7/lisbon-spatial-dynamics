# Run the same locked tools as CI, including the project's runtime dependencies.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: mypy
        name: Strict type checking
        entry: poetry run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
